name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim 0.10+ (embedded editor e2e tests)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install neovim
          else
            # Ubuntu's apt Neovim is 0.9; vista needs 0.10 or newer.
            curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | sudo tar xz -C /opt
            echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit, snapshots, integration, e2e)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
        env:
          INSTA_UPDATE: "no"
      # Failing tests and their panics as annotations, readable without the log.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          grep -E '^test .* FAILED$' test.log | sed -E 's/^test (.*) \.\.\. FAILED$/::error title=Test failed::\1/' | head -20
          grep -E -A3 "^thread '.*' .*panicked at" test.log | grep -v -E '^(--|note: .*|)$' | head -40 | sed -E 's/^/::warning title=Panic::/'
      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.os }}
          path: target/e2e-traces/
