[package]
name = "vista-tui"
description = "vista: a lean, IntelliJ-style terminal file browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vista"
path = "src/main.rs"

[dependencies]
vista-core.workspace = true
dirs = "6"
portable-pty.workspace = true
vt100.workspace = true
vista-theme.workspace = true
vista-git.workspace = true
vista-render.workspace = true
vista-diff.workspace = true
vista-nvim.workspace = true
vista-search.workspace = true
anyhow.workspace = true
ratatui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width = "0.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
base64 = "0.22"
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
vista-e2e.workspace = true
insta.workspace = true
tempfile.workspace = true
toml.workspace = true
