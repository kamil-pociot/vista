# Design A — Darcula Classic (default look).
# Every colour in vista comes from a token below; see crates/vista-theme/src/lib.rs for the full list.
name = "Darcula Classic"

[palette]
"ui.bg" = "#2B2B2B"
"ui.panel" = "#3C3F41"
"ui.panel.alt" = "#2F3133"
"ui.header" = "#BBBBBB"
"ui.border" = "#4A4D50"
"ui.border.focused" = "#4A88C7"
"ui.text" = "#A9B7C6"
"ui.text.strong" = "#E6E6E6"
"ui.dim" = "#939699"
"ui.selection" = "#2F4D73"
"ui.selection.inactive" = "#384049"
"ui.accent" = "#4A88C7"
"ui.cursorline" = "#323232"
"ui.linenr" = "#939699"
"ui.popup" = "#3C3F41"
"ui.popup.border" = "#5E6164"
"ui.input" = "#2B2B2B"
"ui.match" = "#32593D"
"ui.match.text" = "#FFFFFF"
"ui.button" = "#365880"
"ui.button.text" = "#FFFFFF"
"ui.error" = "#FF6B68"
"ui.warning" = "#BBB529"
"ui.success" = "#6FAA61"
"ui.filler" = "#4A5A4C"

"git.modified" = "#72A0C4"
"git.added" = "#6FAA61"
"git.unversioned" = "#E07B6E"
"git.deleted" = "#8C8C8C"
"git.ignored" = "#9C9D2C"
"git.conflict" = "#FF5C5C"
"git.renamed" = "#72A0C4"

"syntax.text" = "#A9B7C6"
"syntax.keyword" = "#D58840"
"syntax.string" = "#7FA06A"
"syntax.function" = "#FFC66D"
"syntax.type" = "#B9C7D6"
"syntax.comment" = "#959595"
"syntax.attribute" = "#BBB529"
"syntax.number" = "#72A0C4"
"syntax.constant" = "#9876AA"
"syntax.operator" = "#A9B7C6"
"syntax.punctuation" = "#A9B7C6"
"syntax.tag" = "#E8BF6A"
"syntax.heading" = "#D58840"
"syntax.link" = "#589DF6"
"syntax.code" = "#A5C25C"

"diff.inserted" = "#294436"
"diff.modified" = "#2C3E55"
"diff.deleted" = "#3D3F41"
"diff.word.inserted" = "#3D6B4A"
"diff.word.modified" = "#44679A"
"diff.word.deleted" = "#5C5F61"
"gutter.added" = "#4E7A4E"
"gutter.modified" = "#4A6A85"
"gutter.deleted" = "#656E76"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
