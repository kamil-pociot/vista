# Gruvbox Light: herdr's "gruvbox-light" theme, from its published palette.
name = "Gruvbox Light"

[palette]
"ui.bg" = "#FBF1C7"
"ui.panel" = "#F2E5BC"
"ui.panel.alt" = "#F2E5BC"
"ui.text" = "#3C3836"
"ui.text.strong" = "#282828"
"ui.dim" = "#7C6F64"
"ui.header" = "#7C6F64"
"ui.border" = "#D5C4A1"
"ui.border.focused" = "#B57614"
"ui.selection" = "#D5C4A1"
"ui.selection.inactive" = "#E6D8B2"
"ui.accent" = "#B57614"
"ui.cursorline" = "#F1E8C0"
"ui.linenr" = "#7C6F64"
"ui.popup" = "#F2E5BC"
"ui.popup.border" = "#BDAE93"
"ui.input" = "#F2E5BC"
"ui.match" = "#E5CA8E"
"ui.match.text" = "#282828"
"ui.button" = "#B57614"
"ui.button.text" = "#000000"
"ui.error" = "#9D0006"
"ui.warning" = "#B57614"
"ui.success" = "#79740E"
"ui.filler" = "#E4DBB6"

"git.modified" = "#076678"
"git.added" = "#79740E"
"git.unversioned" = "#9D0006"
"git.deleted" = "#7C6F64"
"git.ignored" = "#967240"
"git.conflict" = "#9D0006"
"git.renamed" = "#427B58"

"syntax.text" = "#3C3836"
"syntax.keyword" = "#8F3F71"
"syntax.string" = "#79740E"
"syntax.function" = "#076678"
"syntax.type" = "#B57614"
"syntax.comment" = "#928374"
"syntax.attribute" = "#B57614"
"syntax.number" = "#AF3A03"
"syntax.constant" = "#AF3A03"
"syntax.operator" = "#427B58"
"syntax.punctuation" = "#625D53"
"syntax.tag" = "#9D0006"
"syntax.heading" = "#B57614"
"syntax.link" = "#427B58"
"syntax.code" = "#79740E"

"diff.inserted" = "#E6DDA9"
"diff.modified" = "#D4DBBA"
"diff.deleted" = "#ECCAA8"
"diff.word.inserted" = "#CDC586"
"diff.word.modified" = "#A5C0AB"
"diff.word.deleted" = "#DA9C83"
"gutter.added" = "#A09A46"
"gutter.modified" = "#509090"
"gutter.deleted" = "#B94840"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
