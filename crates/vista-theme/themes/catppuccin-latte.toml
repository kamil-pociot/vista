# Catppuccin Latte: herdr's "catppuccin-latte" theme, from its published palette.
name = "Catppuccin Latte"

[palette]
"ui.bg" = "#EFF1F5"
"ui.panel" = "#E6E9EF"
"ui.panel.alt" = "#E6E9EF"
"ui.text" = "#4C4F69"
"ui.text.strong" = "#363849"
"ui.dim" = "#6C6F85"
"ui.header" = "#6C6F85"
"ui.border" = "#CCD0DA"
"ui.border.focused" = "#8839EF"
"ui.selection" = "#CCD0DA"
"ui.selection.inactive" = "#DCDFE6"
"ui.accent" = "#8839EF"
"ui.cursorline" = "#E7E9EE"
"ui.linenr" = "#6C6F85"
"ui.popup" = "#E6E9EF"
"ui.popup.border" = "#ACB0BE"
"ui.input" = "#E6E9EF"
"ui.match" = "#EAD1B0"
"ui.match.text" = "#363849"
"ui.button" = "#8839EF"
"ui.button.text" = "#EFF1F5"
"ui.error" = "#D20F39"
"ui.warning" = "#DF8E1D"
"ui.success" = "#40A02B"
"ui.filler" = "#DBDEE4"

"git.modified" = "#1E66F5"
"git.added" = "#3C9628"
"git.unversioned" = "#D20F39"
"git.deleted" = "#6C6F85"
"git.ignored" = "#A07D56"
"git.conflict" = "#D20F39"
"git.renamed" = "#179299"

"syntax.text" = "#4C4F69"
"syntax.keyword" = "#8839EF"
"syntax.string" = "#3F9D2A"
"syntax.function" = "#1E66F5"
"syntax.type" = "#C07A19"
"syntax.comment" = "#7C7F93"
"syntax.attribute" = "#DF8E1D"
"syntax.number" = "#EA5C0A"
"syntax.constant" = "#FE640B"
"syntax.operator" = "#179299"
"syntax.punctuation" = "#6D6F85"
"syntax.tag" = "#D20F39"
"syntax.heading" = "#8839EF"
"syntax.link" = "#179299"
"syntax.code" = "#40A02B"

"diff.inserted" = "#D3E4D5"
"diff.modified" = "#CEDBF5"
"diff.deleted" = "#EACDD7"
"diff.word.inserted" = "#B1D4AE"
"diff.word.modified" = "#A5C0F5"
"diff.word.deleted" = "#E5A1B3"
"gutter.added" = "#75B868"
"gutter.modified" = "#5D90F5"
"gutter.deleted" = "#DB5371"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
