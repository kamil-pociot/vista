# Catppuccin Latte: herdr's "catppuccin-latte" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Catppuccin Latte"
terminal_bg = "#EFF1F5"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#EFF1F5"
"ui.panel.alt" = "terminal"
"ui.text" = "#5C5F77"
"ui.text.strong" = "#4C4F69"
"ui.dim" = "#868A97"
"ui.header" = "#86899B"
"ui.border" = "#E6E9EF"
"ui.border.focused" = "#1E66F5"
"ui.selection" = "#D7DBE3"
"ui.selection.inactive" = "#E6E9EF"
"ui.accent" = "#1E66F5"
"ui.cursorline" = "#E8EAEF"
"ui.linenr" = "#868A97"
"ui.popup" = "#EFF1F5"
"ui.popup.border" = "#8C8FA1"
"ui.input" = "#EFF1F5"
"ui.match" = "#EAD1B0"
"ui.match.text" = "#4C4F69"
"ui.button" = "#1E66F5"
"ui.button.text" = "#FFFFFF"
"ui.error" = "#D20F39"
"ui.warning" = "#DF8E1D"
"ui.success" = "#40A02B"
"ui.filler" = "#DDDFE6"

"git.modified" = "#1E66F5"
"git.added" = "#3F9D2A"
"git.unversioned" = "#D20F39"
"git.deleted" = "#9CA0B0"
"git.ignored" = "#BA986E"
"git.conflict" = "#D20F39"
"git.renamed" = "#179299"

"syntax.text" = "#4C4F69"
"syntax.keyword" = "#8839EF"
"syntax.string" = "#3F9D2A"
"syntax.function" = "#1E66F5"
"syntax.type" = "#C07A19"
"syntax.comment" = "#7C7F93"
"syntax.attribute" = "#DF8E1D"
"syntax.number" = "#EA5C0A"
"syntax.constant" = "#FE640B"
"syntax.operator" = "#179299"
"syntax.punctuation" = "#797C90"
"syntax.tag" = "#D20F39"
"syntax.heading" = "#1E66F5"
"syntax.link" = "#179299"
"syntax.code" = "#40A02B"

"diff.inserted" = "#D3E4D5"
"diff.modified" = "#CEDBF5"
"diff.deleted" = "#EACDD7"
"diff.word.inserted" = "#B1D4AE"
"diff.word.modified" = "#A5C0F5"
"diff.word.deleted" = "#E5A1B3"
"gutter.added" = "#75B868"
"gutter.modified" = "#5D90F5"
"gutter.deleted" = "#DB5371"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
