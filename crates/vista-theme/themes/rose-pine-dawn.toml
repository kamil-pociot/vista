# Rosé Pine Dawn: herdr's "rose-pine-dawn" theme, from its published palette.
name = "Rosé Pine Dawn"

[palette]
"ui.bg" = "#FAF4ED"
"ui.panel" = "#FFFAF3"
"ui.panel.alt" = "#FFFAF3"
"ui.text" = "#575279"
"ui.text.strong" = "#575279"
"ui.dim" = "#797593"
"ui.header" = "#797593"
"ui.border" = "#F2E9E1"
"ui.border.focused" = "#907AA9"
"ui.selection" = "#DFDAD9"
"ui.selection.inactive" = "#F2E9E1"
"ui.accent" = "#907AA9"
"ui.cursorline" = "#F2ECE7"
"ui.linenr" = "#797593"
"ui.popup" = "#FFFAF3"
"ui.popup.border" = "#CECACD"
"ui.input" = "#FFFAF3"
"ui.match" = "#F5D8B2"
"ui.match.text" = "#575279"
"ui.button" = "#907AA9"
"ui.button.text" = "#000000"
"ui.error" = "#B4637A"
"ui.warning" = "#EA9D34"
"ui.success" = "#286983"
"ui.filler" = "#E6E1DF"

"git.modified" = "#56949F"
"git.added" = "#286983"
"git.unversioned" = "#B4637A"
"git.deleted" = "#797593"
"git.ignored" = "#AC8768"
"git.conflict" = "#B4637A"
"git.renamed" = "#56949F"

"syntax.text" = "#575279"
"syntax.keyword" = "#907AA9"
"syntax.string" = "#286983"
"syntax.function" = "#56949F"
"syntax.type" = "#56949F"
"syntax.comment" = "#8F8A9B"
"syntax.attribute" = "#EA9D34"
"syntax.number" = "#C67874"
"syntax.constant" = "#D7827E"
"syntax.operator" = "#56949F"
"syntax.punctuation" = "#787290"
"syntax.tag" = "#B4637A"
"syntax.heading" = "#907AA9"
"syntax.link" = "#56949F"
"syntax.code" = "#286983"

"diff.inserted" = "#D8DEDC"
"diff.modified" = "#E0E5E1"
"diff.deleted" = "#EFDDDB"
"diff.word.inserted" = "#B0C3C8"
"diff.word.modified" = "#C0D2D2"
"diff.word.deleted" = "#E1C1C5"
"gutter.added" = "#6793A3"
"gutter.modified" = "#87B1B6"
"gutter.deleted" = "#C98E9C"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
