# Kanagawa Lotus: herdr's "kanagawa-lotus" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Kanagawa Lotus"
terminal_bg = "#F2ECBC"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#F2ECBC"
"ui.panel.alt" = "terminal"
"ui.text" = "#636272"
"ui.text.strong" = "#545464"
"ui.dim" = "#868390"
"ui.header" = "#87867D"
"ui.border" = "#D5CEA3"
"ui.border.focused" = "#4D699B"
"ui.selection" = "#E5E1C3"
"ui.selection.inactive" = "#D5CEA3"
"ui.accent" = "#4D699B"
"ui.cursorline" = "#EBE5B8"
"ui.linenr" = "#868390"
"ui.popup" = "#F2ECBC"
"ui.popup.border" = "#8A8980"
"ui.input" = "#F2ECBC"
"ui.match" = "#CBC594"
"ui.match.text" = "#4F4F5E"
"ui.button" = "#4D699B"
"ui.button.text" = "#F2ECBC"
"ui.error" = "#C84053"
"ui.warning" = "#77713F"
"ui.success" = "#6F894E"
"ui.filler" = "#E1DBB3"

"git.modified" = "#4D699B"
"git.added" = "#6F894E"
"git.unversioned" = "#D7474B"
"git.deleted" = "#A09CAC"
"git.ignored" = "#8E897B"
"git.conflict" = "#E82424"
"git.renamed" = "#4E8CA2"

"syntax.text" = "#545464"
"syntax.keyword" = "#624C83"
"syntax.string" = "#6F894E"
"syntax.function" = "#4D699B"
"syntax.type" = "#597B75"
"syntax.comment" = "#87867D"
"syntax.attribute" = "#77713F"
"syntax.number" = "#CC6D00"
"syntax.constant" = "#CC6D00"
"syntax.operator" = "#4E8CA2"
"syntax.punctuation" = "#807E81"
"syntax.tag" = "#C84053"
"syntax.heading" = "#4D699B"
"syntax.link" = "#4E8CA2"
"syntax.code" = "#6F894E"

"diff.inserted" = "#DDDCAA"
"diff.modified" = "#D8D7B7"
"diff.deleted" = "#EBD0AB"
"diff.word.inserted" = "#C4C995"
"diff.word.modified" = "#B8BEB0"
"diff.word.deleted" = "#E3AF97"
"gutter.added" = "#96A76F"
"gutter.modified" = "#7E90A5"
"gutter.deleted" = "#D57472"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
