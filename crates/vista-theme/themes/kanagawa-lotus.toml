# Kanagawa Lotus: herdr's "kanagawa-lotus" theme, from its published palette.
name = "Kanagawa Lotus"

[palette]
"ui.bg" = "#F2ECBC"
"ui.panel" = "#E5DDB0"
"ui.panel.alt" = "#E7DBA0"
"ui.text" = "#545464"
"ui.text.strong" = "#43436C"
"ui.dim" = "#716E61"
"ui.header" = "#716E61"
"ui.border" = "#DCD5AC"
"ui.border.focused" = "#4D699B"
"ui.selection" = "#C9CBD1"
"ui.selection.inactive" = "#DCD5AC"
"ui.accent" = "#4D699B"
"ui.cursorline" = "#EAE4B8"
"ui.linenr" = "#716E61"
"ui.popup" = "#E5DDB0"
"ui.popup.border" = "#A09CAC"
"ui.input" = "#E5DDB0"
"ui.match" = "#CBC594"
"ui.match.text" = "#43436C"
"ui.button" = "#4D699B"
"ui.button.text" = "#F2ECBC"
"ui.error" = "#C84053"
"ui.warning" = "#77713F"
"ui.success" = "#6F894E"
"ui.filler" = "#DFDAB1"

"git.modified" = "#4D699B"
"git.added" = "#688149"
"git.unversioned" = "#D7474B"
"git.deleted" = "#716E61"
"git.ignored" = "#746F52"
"git.conflict" = "#E82424"
"git.renamed" = "#4E8CA2"

"syntax.text" = "#545464"
"syntax.keyword" = "#624C83"
"syntax.string" = "#6F894E"
"syntax.function" = "#4D699B"
"syntax.type" = "#597B75"
"syntax.comment" = "#87867D"
"syntax.attribute" = "#77713F"
"syntax.number" = "#CC6D00"
"syntax.constant" = "#CC6D00"
"syntax.operator" = "#4E8CA2"
"syntax.punctuation" = "#747276"
"syntax.tag" = "#C84053"
"syntax.heading" = "#4D699B"
"syntax.link" = "#4E8CA2"
"syntax.code" = "#6F894E"

"diff.inserted" = "#DDDCAA"
"diff.modified" = "#D8D7B7"
"diff.deleted" = "#EBD0AB"
"diff.word.inserted" = "#C4C995"
"diff.word.modified" = "#B8BEB0"
"diff.word.deleted" = "#E3AF97"
"gutter.added" = "#96A76F"
"gutter.modified" = "#7E90A5"
"gutter.deleted" = "#D57472"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
