# Vesper: herdr's "vesper" theme, from its published palette.
name = "Vesper"

[palette]
"ui.bg" = "#101010"
"ui.panel" = "#161616"
"ui.panel.alt" = "#101010"
"ui.text" = "#FFFFFF"
"ui.text.strong" = "#FFFFFF"
"ui.dim" = "#A0A0A0"
"ui.header" = "#A0A0A0"
"ui.border" = "#232323"
"ui.border.focused" = "#FFC799"
"ui.selection" = "#2A2A2A"
"ui.selection.inactive" = "#1C1C1C"
"ui.accent" = "#FFC799"
"ui.cursorline" = "#1C1C1C"
"ui.linenr" = "#A0A0A0"
"ui.popup" = "#161616"
"ui.popup.border" = "#505050"
"ui.input" = "#161616"
"ui.match" = "#5C4B3C"
"ui.match.text" = "#FFFFFF"
"ui.button" = "#FFC799"
"ui.button.text" = "#101010"
"ui.error" = "#FF8080"
"ui.warning" = "#FFC799"
"ui.success" = "#99FFE4"
"ui.filler" = "#2D2D2D"

"git.modified" = "#FFC799"
"git.added" = "#99FFE4"
"git.unversioned" = "#FF8080"
"git.deleted" = "#A0A0A0"
"git.ignored" = "#CBB29D"
"git.conflict" = "#FF8080"
"git.renamed" = "#99FFE4"

"syntax.text" = "#FFFFFF"
"syntax.keyword" = "#A0A0A0"
"syntax.string" = "#99FFE4"
"syntax.function" = "#FFC799"
"syntax.type" = "#FFC799"
"syntax.comment" = "#8B8B8B"
"syntax.attribute" = "#FFC799"
"syntax.number" = "#FFC799"
"syntax.constant" = "#FFC799"
"syntax.operator" = "#99FFE4"
"syntax.punctuation" = "#CFCFCF"
"syntax.tag" = "#FF8080"
"syntax.heading" = "#FFC799"
"syntax.link" = "#99FFE4"
"syntax.code" = "#99FFE4"

"diff.inserted" = "#2B403A"
"diff.modified" = "#40352B"
"diff.deleted" = "#402626"
"diff.word.inserted" = "#4C796D"
"diff.word.modified" = "#79614C"
"diff.word.deleted" = "#794141"
"gutter.added" = "#70B7A4"
"gutter.modified" = "#B79070"
"gutter.deleted" = "#B75E5E"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
