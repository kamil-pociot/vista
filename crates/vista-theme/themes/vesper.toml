# Vesper: herdr's "vesper" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Vesper"
terminal_bg = "#101010"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#1A1A1A"
"ui.panel.alt" = "terminal"
"ui.text" = "#DEDEDE"
"ui.text.strong" = "#FFFFFF"
"ui.dim" = "#636363"
"ui.header" = "#7E7E7E"
"ui.border" = "#101010"
"ui.border.focused" = "#FFC799"
"ui.selection" = "#2A2A2A"
"ui.selection.inactive" = "#101010"
"ui.accent" = "#FFC799"
"ui.cursorline" = "#1A1A1A"
"ui.linenr" = "#636363"
"ui.popup" = "#1A1A1A"
"ui.popup.border" = "#7E7E7E"
"ui.input" = "#1A1A1A"
"ui.match" = "#5C4B3C"
"ui.match.text" = "#FFFFFF"
"ui.button" = "#FFC799"
"ui.button.text" = "#1A1A1A"
"ui.error" = "#FF8080"
"ui.warning" = "#FFC799"
"ui.success" = "#99FFE4"
"ui.filler" = "#292929"

"git.modified" = "#FFC799"
"git.added" = "#99FFE4"
"git.unversioned" = "#FF8080"
"git.deleted" = "#5C5C5C"
"git.ignored" = "#A58C77"
"git.conflict" = "#FF8080"
"git.renamed" = "#99FFE4"

"syntax.text" = "#FFFFFF"
"syntax.keyword" = "#A0A0A0"
"syntax.string" = "#99FFE4"
"syntax.function" = "#FFC799"
"syntax.type" = "#FFC799"
"syntax.comment" = "#8B8B8B"
"syntax.attribute" = "#FFC799"
"syntax.number" = "#FFC799"
"syntax.constant" = "#FFC799"
"syntax.operator" = "#99FFE4"
"syntax.punctuation" = "#B5B5B5"
"syntax.tag" = "#FF8080"
"syntax.heading" = "#FFC799"
"syntax.link" = "#99FFE4"
"syntax.code" = "#99FFE4"

"diff.inserted" = "#2B403A"
"diff.modified" = "#40352B"
"diff.deleted" = "#402626"
"diff.word.inserted" = "#4C796D"
"diff.word.modified" = "#79614C"
"diff.word.deleted" = "#794141"
"gutter.added" = "#70B7A4"
"gutter.modified" = "#B79070"
"gutter.deleted" = "#B75E5E"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
