# One Dark: herdr's "one-dark" theme, from its published palette.
name = "One Dark"

[palette]
"ui.bg" = "#282C34"
"ui.panel" = "#21252B"
"ui.panel.alt" = "#21252B"
"ui.text" = "#ABB2BF"
"ui.text.strong" = "#D7DAE0"
"ui.dim" = "#7F848E"
"ui.header" = "#7F848E"
"ui.border" = "#3E4451"
"ui.border.focused" = "#61AFEF"
"ui.selection" = "#3E4451"
"ui.selection.inactive" = "#343944"
"ui.accent" = "#61AFEF"
"ui.cursorline" = "#2F333B"
"ui.linenr" = "#7F848E"
"ui.popup" = "#21252B"
"ui.popup.border" = "#4B5263"
"ui.input" = "#21252B"
"ui.match" = "#645B4B"
"ui.match.text" = "#D7DAE0"
"ui.button" = "#61AFEF"
"ui.button.text" = "#282C34"
"ui.error" = "#E06C75"
"ui.warning" = "#E5C07B"
"ui.success" = "#98C379"
"ui.filler" = "#383C45"

"git.modified" = "#61AFEF"
"git.added" = "#98C379"
"git.unversioned" = "#E06C75"
"git.deleted" = "#7F848E"
"git.ignored" = "#AD9F85"
"git.conflict" = "#E06C75"
"git.renamed" = "#56B6C2"

"syntax.text" = "#ABB2BF"
"syntax.keyword" = "#C678DD"
"syntax.string" = "#98C379"
"syntax.function" = "#61AFEF"
"syntax.type" = "#E5C07B"
"syntax.comment" = "#707681"
"syntax.attribute" = "#E5C07B"
"syntax.number" = "#D19A66"
"syntax.constant" = "#D19A66"
"syntax.operator" = "#56B6C2"
"syntax.punctuation" = "#9197A3"
"syntax.tag" = "#E06C75"
"syntax.heading" = "#61AFEF"
"syntax.link" = "#56B6C2"
"syntax.code" = "#98C379"

"diff.inserted" = "#3B4640"
"diff.modified" = "#334659"
"diff.deleted" = "#4D3941"
"diff.word.inserted" = "#51634D"
"diff.word.modified" = "#3F617F"
"diff.word.deleted" = "#794851"
"gutter.added" = "#769664"
"gutter.modified" = "#5088B7"
"gutter.deleted" = "#A95962"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
