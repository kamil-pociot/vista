# One Dark: herdr's "one-dark" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "One Dark"
terminal_bg = "#282C34"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#282C34"
"ui.panel.alt" = "terminal"
"ui.text" = "#9BA2AF"
"ui.text.strong" = "#ABB2BF"
"ui.dim" = "#707681"
"ui.header" = "#737A87"
"ui.border" = "#282C34"
"ui.border.focused" = "#61AFEF"
"ui.selection" = "#343944"
"ui.selection.inactive" = "#313640"
"ui.accent" = "#61AFEF"
"ui.cursorline" = "#2E323A"
"ui.linenr" = "#707681"
"ui.popup" = "#282C34"
"ui.popup.border" = "#737A87"
"ui.input" = "#282C34"
"ui.match" = "#645B4B"
"ui.match.text" = "#D2D5DC"
"ui.button" = "#61AFEF"
"ui.button.text" = "#282C34"
"ui.error" = "#E06C75"
"ui.warning" = "#E5C07B"
"ui.success" = "#98C379"
"ui.filler" = "#363A43"

"git.modified" = "#61AFEF"
"git.added" = "#98C379"
"git.unversioned" = "#E06C75"
"git.deleted" = "#5C6370"
"git.ignored" = "#9A8D75"
"git.conflict" = "#E06C75"
"git.renamed" = "#56B6C2"

"syntax.text" = "#ABB2BF"
"syntax.keyword" = "#C678DD"
"syntax.string" = "#98C379"
"syntax.function" = "#61AFEF"
"syntax.type" = "#E5C07B"
"syntax.comment" = "#707681"
"syntax.attribute" = "#E5C07B"
"syntax.number" = "#D19A66"
"syntax.constant" = "#D19A66"
"syntax.operator" = "#56B6C2"
"syntax.punctuation" = "#848A96"
"syntax.tag" = "#E06C75"
"syntax.heading" = "#61AFEF"
"syntax.link" = "#56B6C2"
"syntax.code" = "#98C379"

"diff.inserted" = "#3B4640"
"diff.modified" = "#334659"
"diff.deleted" = "#4D3941"
"diff.word.inserted" = "#51634D"
"diff.word.modified" = "#3F617F"
"diff.word.deleted" = "#794851"
"gutter.added" = "#769664"
"gutter.modified" = "#5088B7"
"gutter.deleted" = "#A95962"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
