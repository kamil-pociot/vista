# Solarized Dark: herdr's "solarized" theme, from its published palette.
name = "Solarized Dark"

[palette]
"ui.bg" = "#002B36"
"ui.panel" = "#073642"
"ui.panel.alt" = "#002B36"
"ui.text" = "#93A1A1"
"ui.text.strong" = "#EEE8D5"
"ui.dim" = "#839496"
"ui.header" = "#839496"
"ui.border" = "#073642"
"ui.border.focused" = "#268BD2"
"ui.selection" = "#073B48"
"ui.selection.inactive" = "#073642"
"ui.accent" = "#268BD2"
"ui.cursorline" = "#07313B"
"ui.linenr" = "#839496"
"ui.popup" = "#073642"
"ui.popup.border" = "#586E75"
"ui.input" = "#073642"
"ui.match" = "#3A4925"
"ui.match.text" = "#EEE8D5"
"ui.button" = "#268BD2"
"ui.button.text" = "#000000"
"ui.error" = "#DC322F"
"ui.warning" = "#B58900"
"ui.success" = "#859900"
"ui.filler" = "#123943"

"git.modified" = "#268BD2"
"git.added" = "#859900"
"git.unversioned" = "#DC322F"
"git.deleted" = "#839496"
"git.ignored" = "#9A8F52"
"git.conflict" = "#DC322F"
"git.renamed" = "#2AA198"

"syntax.text" = "#93A1A1"
"syntax.keyword" = "#6C71C4"
"syntax.string" = "#859900"
"syntax.function" = "#268BD2"
"syntax.type" = "#B58900"
"syntax.comment" = "#657B83"
"syntax.attribute" = "#B58900"
"syntax.number" = "#CB4B16"
"syntax.constant" = "#CB4B16"
"syntax.operator" = "#2AA198"
"syntax.punctuation" = "#76898C"
"syntax.tag" = "#DC322F"
"syntax.heading" = "#268BD2"
"syntax.link" = "#2AA198"
"syntax.code" = "#859900"

"diff.inserted" = "#173D2D"
"diff.modified" = "#063A4F"
"diff.deleted" = "#2C2C35"
"diff.word.inserted" = "#365720"
"diff.word.modified" = "#11557B"
"diff.word.deleted" = "#612E33"
"gutter.added" = "#5D7810"
"gutter.modified" = "#1B6EA3"
"gutter.deleted" = "#9A3031"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
