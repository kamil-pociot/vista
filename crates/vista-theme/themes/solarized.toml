# Solarized: herdr's "solarized" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Solarized"
terminal_bg = "#002B36"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#002B36"
"ui.panel.alt" = "terminal"
"ui.text" = "#879798"
"ui.text.strong" = "#93A1A1"
"ui.dim" = "#5F747B"
"ui.header" = "#657B83"
"ui.border" = "#002B36"
"ui.border.focused" = "#268BD2"
"ui.selection" = "#03323E"
"ui.selection.inactive" = "#164B57"
"ui.accent" = "#268BD2"
"ui.cursorline" = "#07303B"
"ui.linenr" = "#5F747B"
"ui.popup" = "#002B36"
"ui.popup.border" = "#657B83"
"ui.input" = "#002B36"
"ui.match" = "#3A4925"
"ui.match.text" = "#A9B4B4"
"ui.button" = "#268BD2"
"ui.button.text" = "#000000"
"ui.error" = "#DC322F"
"ui.warning" = "#B58900"
"ui.success" = "#859900"
"ui.filler" = "#103842"

"git.modified" = "#268BD2"
"git.added" = "#859900"
"git.unversioned" = "#DC322F"
"git.deleted" = "#586E75"
"git.ignored" = "#827A40"
"git.conflict" = "#DC322F"
"git.renamed" = "#2AA198"

"syntax.text" = "#93A1A1"
"syntax.keyword" = "#6C71C4"
"syntax.string" = "#859900"
"syntax.function" = "#268BD2"
"syntax.type" = "#B58900"
"syntax.comment" = "#657B83"
"syntax.attribute" = "#B58900"
"syntax.number" = "#CB4B16"
"syntax.constant" = "#CB4B16"
"syntax.operator" = "#2AA198"
"syntax.punctuation" = "#6C8184"
"syntax.tag" = "#DC322F"
"syntax.heading" = "#268BD2"
"syntax.link" = "#2AA198"
"syntax.code" = "#859900"

"diff.inserted" = "#173D2D"
"diff.modified" = "#063A4F"
"diff.deleted" = "#2C2C35"
"diff.word.inserted" = "#365720"
"diff.word.modified" = "#11557B"
"diff.word.deleted" = "#612E33"
"gutter.added" = "#5D7810"
"gutter.modified" = "#1B6EA3"
"gutter.deleted" = "#9A3031"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
