# Nord: herdr's "nord" theme, from its published palette.
name = "Nord"

[palette]
"ui.bg" = "#2E3440"
"ui.panel" = "#3B4252"
"ui.panel.alt" = "#2E3440"
"ui.text" = "#D8DEE9"
"ui.text.strong" = "#ECEFF4"
"ui.dim" = "#8C97AD"
"ui.header" = "#8C97AD"
"ui.border" = "#434C5E"
"ui.border.focused" = "#88C0D0"
"ui.selection" = "#434C5E"
"ui.selection.inactive" = "#3B4252"
"ui.accent" = "#88C0D0"
"ui.cursorline" = "#363C48"
"ui.linenr" = "#8C97AD"
"ui.popup" = "#3B4252"
"ui.popup.border" = "#4C566A"
"ui.input" = "#3B4252"
"ui.match" = "#6A6458"
"ui.match.text" = "#ECEFF4"
"ui.button" = "#88C0D0"
"ui.button.text" = "#2E3440"
"ui.error" = "#BF616A"
"ui.warning" = "#EBCB8B"
"ui.success" = "#A3BE8C"
"ui.filler" = "#424854"

"git.modified" = "#81A1C1"
"git.added" = "#A3BE8C"
"git.unversioned" = "#BF616A"
"git.deleted" = "#8C97AD"
"git.ignored" = "#B7AE9E"
"git.conflict" = "#BF616A"
"git.renamed" = "#88C0D0"

"syntax.text" = "#D8DEE9"
"syntax.keyword" = "#B48EAD"
"syntax.string" = "#A3BE8C"
"syntax.function" = "#81A1C1"
"syntax.type" = "#8FBCBB"
"syntax.comment" = "#7B88A1"
"syntax.attribute" = "#EBCB8B"
"syntax.number" = "#D08770"
"syntax.constant" = "#D08770"
"syntax.operator" = "#88C0D0"
"syntax.punctuation" = "#B6BCC7"
"syntax.tag" = "#BF616A"
"syntax.heading" = "#88C0D0"
"syntax.link" = "#88C0D0"
"syntax.code" = "#A3BE8C"

"diff.inserted" = "#45504F"
"diff.modified" = "#3F4A5A"
"diff.deleted" = "#4B3D48"
"diff.word.inserted" = "#617161"
"diff.word.modified" = "#536479"
"diff.word.deleted" = "#6E4852"
"gutter.added" = "#809575"
"gutter.modified" = "#68809A"
"gutter.deleted" = "#94545D"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
