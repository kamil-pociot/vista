# Nord: herdr's "nord" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Nord"
terminal_bg = "#2E3440"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#2E3440"
"ui.panel.alt" = "terminal"
"ui.text" = "#CCD0D8"
"ui.text.strong" = "#ECEFF4"
"ui.dim" = "#777F8E"
"ui.header" = "#777F91"
"ui.border" = "#2E3440"
"ui.border.focused" = "#88C0D0"
"ui.selection" = "#434C5E"
"ui.selection.inactive" = "#434C5E"
"ui.accent" = "#88C0D0"
"ui.cursorline" = "#363C48"
"ui.linenr" = "#777F8E"
"ui.popup" = "#2E3440"
"ui.popup.border" = "#646E82"
"ui.input" = "#2E3440"
"ui.match" = "#6A6458"
"ui.match.text" = "#ECEFF4"
"ui.button" = "#88C0D0"
"ui.button.text" = "#2E3440"
"ui.error" = "#BF616A"
"ui.warning" = "#EBCB8B"
"ui.success" = "#A3BE8C"
"ui.filler" = "#414752"

"git.modified" = "#81A1C1"
"git.added" = "#A3BE8C"
"git.unversioned" = "#BF616A"
"git.deleted" = "#4C566A"
"git.ignored" = "#948B79"
"git.conflict" = "#BF616A"
"git.renamed" = "#88C0D0"

"syntax.text" = "#ECEFF4"
"syntax.keyword" = "#B48EAD"
"syntax.string" = "#A3BE8C"
"syntax.function" = "#81A1C1"
"syntax.type" = "#8FBCBB"
"syntax.comment" = "#7B88A1"
"syntax.attribute" = "#EBCB8B"
"syntax.number" = "#D08770"
"syntax.constant" = "#D08770"
"syntax.operator" = "#88C0D0"
"syntax.punctuation" = "#ACB1BA"
"syntax.tag" = "#BF616A"
"syntax.heading" = "#88C0D0"
"syntax.link" = "#88C0D0"
"syntax.code" = "#A3BE8C"

"diff.inserted" = "#45504F"
"diff.modified" = "#3F4A5A"
"diff.deleted" = "#4B3D48"
"diff.word.inserted" = "#617161"
"diff.word.modified" = "#536479"
"diff.word.deleted" = "#6E4852"
"gutter.added" = "#809575"
"gutter.modified" = "#68809A"
"gutter.deleted" = "#94545D"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
