# Catppuccin Mocha: herdr's "catppuccin" theme, from its published palette.
name = "Catppuccin Mocha"

[palette]
"ui.bg" = "#1E1E2E"
"ui.panel" = "#181825"
"ui.panel.alt" = "#181825"
"ui.text" = "#CDD6F4"
"ui.text.strong" = "#E4E9FB"
"ui.dim" = "#9399B2"
"ui.header" = "#9399B2"
"ui.border" = "#313244"
"ui.border.focused" = "#CBA6F7"
"ui.selection" = "#45475A"
"ui.selection.inactive" = "#333546"
"ui.accent" = "#CBA6F7"
"ui.cursorline" = "#272738"
"ui.linenr" = "#9399B2"
"ui.popup" = "#181825"
"ui.popup.border" = "#585B70"
"ui.input" = "#181825"
"ui.match" = "#645D57"
"ui.match.text" = "#E4E9FB"
"ui.button" = "#CBA6F7"
"ui.button.text" = "#1E1E2E"
"ui.error" = "#F38BA8"
"ui.warning" = "#F9E2AF"
"ui.success" = "#A6E3A1"
"ui.filler" = "#333446"

"git.modified" = "#89B4FA"
"git.added" = "#A6E3A1"
"git.unversioned" = "#F38BA8"
"git.deleted" = "#9399B2"
"git.ignored" = "#C1BAB1"
"git.conflict" = "#F38BA8"
"git.renamed" = "#94E2D5"

"syntax.text" = "#CDD6F4"
"syntax.keyword" = "#CBA6F7"
"syntax.string" = "#A6E3A1"
"syntax.function" = "#89B4FA"
"syntax.type" = "#F9E2AF"
"syntax.comment" = "#7F849C"
"syntax.attribute" = "#F9E2AF"
"syntax.number" = "#FAB387"
"syntax.constant" = "#FAB387"
"syntax.operator" = "#94E2D5"
"syntax.punctuation" = "#AAB1CC"
"syntax.tag" = "#F38BA8"
"syntax.heading" = "#CBA6F7"
"syntax.link" = "#94E2D5"
"syntax.code" = "#A6E3A1"

"diff.inserted" = "#394545"
"diff.modified" = "#333C57"
"diff.deleted" = "#493446"
"diff.word.inserted" = "#5A7561"
"diff.word.modified" = "#4D6088"
"diff.word.deleted" = "#7C4E64"
"gutter.added" = "#7DA87E"
"gutter.modified" = "#6987BD"
"gutter.deleted" = "#B36A83"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
