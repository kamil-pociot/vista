# Catppuccin: herdr's "catppuccin" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Catppuccin"
terminal_bg = "#1E1E2E"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#181825"
"ui.panel.alt" = "terminal"
"ui.text" = "#BAC2DE"
"ui.text.strong" = "#CDD6F4"
"ui.dim" = "#6C7086"
"ui.header" = "#7F849C"
"ui.border" = "#1E1E2E"
"ui.border.focused" = "#89B4FA"
"ui.selection" = "#45475A"
"ui.selection.inactive" = "#1E1E2E"
"ui.accent" = "#89B4FA"
"ui.cursorline" = "#262637"
"ui.linenr" = "#6C7086"
"ui.popup" = "#181825"
"ui.popup.border" = "#7F849C"
"ui.input" = "#181825"
"ui.match" = "#645D57"
"ui.match.text" = "#CED7F4"
"ui.button" = "#89B4FA"
"ui.button.text" = "#181825"
"ui.error" = "#F38BA8"
"ui.warning" = "#F9E2AF"
"ui.success" = "#A6E3A1"
"ui.filler" = "#313243"

"git.modified" = "#89B4FA"
"git.added" = "#A6E3A1"
"git.unversioned" = "#F38BA8"
"git.deleted" = "#6C7086"
"git.ignored" = "#ABA398"
"git.conflict" = "#F38BA8"
"git.renamed" = "#94E2D5"

"syntax.text" = "#CDD6F4"
"syntax.keyword" = "#CBA6F7"
"syntax.string" = "#A6E3A1"
"syntax.function" = "#89B4FA"
"syntax.type" = "#F9E2AF"
"syntax.comment" = "#7F849C"
"syntax.attribute" = "#F9E2AF"
"syntax.number" = "#FAB387"
"syntax.constant" = "#FAB387"
"syntax.operator" = "#94E2D5"
"syntax.punctuation" = "#9BA1BB"
"syntax.tag" = "#F38BA8"
"syntax.heading" = "#89B4FA"
"syntax.link" = "#94E2D5"
"syntax.code" = "#A6E3A1"

"diff.inserted" = "#394545"
"diff.modified" = "#333C57"
"diff.deleted" = "#493446"
"diff.word.inserted" = "#5A7561"
"diff.word.modified" = "#4D6088"
"diff.word.deleted" = "#7C4E64"
"gutter.added" = "#7DA87E"
"gutter.modified" = "#6987BD"
"gutter.deleted" = "#B36A83"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
