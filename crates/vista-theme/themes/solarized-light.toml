# Solarized Light: herdr's "solarized-light" theme, from its published palette.
name = "Solarized Light"

[palette]
"ui.bg" = "#FDF6E3"
"ui.panel" = "#EEE8D5"
"ui.panel.alt" = "#FDF6E3"
"ui.text" = "#566C73"
"ui.text.strong" = "#073642"
"ui.dim" = "#657B83"
"ui.header" = "#657B83"
"ui.border" = "#EEE8D5"
"ui.border.focused" = "#268BD2"
"ui.selection" = "#EFE8D4"
"ui.selection.inactive" = "#EEE8D5"
"ui.accent" = "#268BD2"
"ui.cursorline" = "#F5EFDD"
"ui.linenr" = "#657B83"
"ui.popup" = "#EEE8D5"
"ui.popup.border" = "#93A1A1"
"ui.input" = "#EEE8D5"
"ui.match" = "#E6D39A"
"ui.match.text" = "#073642"
"ui.button" = "#268BD2"
"ui.button.text" = "#000000"
"ui.error" = "#DC322F"
"ui.warning" = "#B58900"
"ui.success" = "#859900"
"ui.filler" = "#E9E6D6"

"git.modified" = "#268BD2"
"git.added" = "#829600"
"git.unversioned" = "#DC322F"
"git.deleted" = "#657B83"
"git.ignored" = "#898148"
"git.conflict" = "#DC322F"
"git.renamed" = "#2AA198"

"syntax.text" = "#566C73"
"syntax.keyword" = "#6C71C4"
"syntax.string" = "#829600"
"syntax.function" = "#268BD2"
"syntax.type" = "#B18600"
"syntax.comment" = "#849191"
"syntax.attribute" = "#B58900"
"syntax.number" = "#CB4B16"
"syntax.constant" = "#CB4B16"
"syntax.operator" = "#2AA198"
"syntax.punctuation" = "#79898B"
"syntax.tag" = "#DC322F"
"syntax.heading" = "#268BD2"
"syntax.link" = "#2AA198"
"syntax.code" = "#859900"

"diff.inserted" = "#EDE9C5"
"diff.modified" = "#E5EAE1"
"diff.deleted" = "#FAE5D3"
"diff.word.inserted" = "#D3D593"
"diff.word.modified" = "#B1D0DD"
"diff.word.deleted" = "#F1B1A4"
"gutter.added" = "#A9B544"
"gutter.modified" = "#66ABD7"
"gutter.deleted" = "#E66D65"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
