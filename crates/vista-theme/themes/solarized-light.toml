# Solarized Light: herdr's "solarized-light" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Solarized Light"
terminal_bg = "#FDF6E3"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#FDF6E3"
"ui.panel.alt" = "terminal"
"ui.text" = "#617379"
"ui.text.strong" = "#5F747B"
"ui.dim" = "#849191"
"ui.header" = "#586E75"
"ui.border" = "#EEE8D5"
"ui.border.focused" = "#268BD2"
"ui.selection" = "#FBF4E1"
"ui.selection.inactive" = "#EEE8D5"
"ui.accent" = "#268BD2"
"ui.cursorline" = "#F6F0DE"
"ui.linenr" = "#849191"
"ui.popup" = "#FDF6E3"
"ui.popup.border" = "#586E75"
"ui.input" = "#FDF6E3"
"ui.match" = "#E6D39A"
"ui.match.text" = "#4C5D62"
"ui.button" = "#268BD2"
"ui.button.text" = "#000000"
"ui.error" = "#DC322F"
"ui.warning" = "#B58900"
"ui.success" = "#859900"
"ui.filler" = "#ECE8D8"

"git.modified" = "#268BD2"
"git.added" = "#829600"
"git.unversioned" = "#DC322F"
"git.deleted" = "#93A1A1"
"git.ignored" = "#A29659"
"git.conflict" = "#DC322F"
"git.renamed" = "#2AA198"

"syntax.text" = "#5F747B"
"syntax.keyword" = "#6C71C4"
"syntax.string" = "#829600"
"syntax.function" = "#268BD2"
"syntax.type" = "#B18600"
"syntax.comment" = "#849191"
"syntax.attribute" = "#B58900"
"syntax.number" = "#CB4B16"
"syntax.constant" = "#CB4B16"
"syntax.operator" = "#2AA198"
"syntax.punctuation" = "#8B9A9B"
"syntax.tag" = "#DC322F"
"syntax.heading" = "#268BD2"
"syntax.link" = "#2AA198"
"syntax.code" = "#859900"

"diff.inserted" = "#FBF5E0"
"diff.modified" = "#FAF5E3"
"diff.deleted" = "#FDF5E2"
"diff.word.inserted" = "#D3D593"
"diff.word.modified" = "#B1D0DD"
"diff.word.deleted" = "#F3BFB1"
"gutter.added" = "#A9B544"
"gutter.modified" = "#66ABD7"
"gutter.deleted" = "#E66D65"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
