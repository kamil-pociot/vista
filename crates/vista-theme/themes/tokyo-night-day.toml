# Tokyo Night Day: herdr's "tokyo-night-day" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Tokyo Night Day"
terminal_bg = "#E1E2E7"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#E1E2E7"
"ui.panel.alt" = "terminal"
"ui.text" = "#4162AE"
"ui.text.strong" = "#3760BF"
"ui.dim" = "#797F9E"
"ui.header" = "#68709A"
"ui.border" = "#D2D3DA"
"ui.border.focused" = "#2E7DE9"
"ui.selection" = "#E1E2E7"
"ui.selection.inactive" = "#D2D3DA"
"ui.accent" = "#2E7DE9"
"ui.cursorline" = "#D9DCE5"
"ui.linenr" = "#797F9E"
"ui.popup" = "#E1E2E7"
"ui.popup.border" = "#68709A"
"ui.input" = "#E1E2E7"
"ui.match" = "#C6BCB1"
"ui.match.text" = "#2A4991"
"ui.button" = "#2E7DE9"
"ui.button.text" = "#000000"
"ui.error" = "#F52A65"
"ui.warning" = "#8C6C3E"
"ui.success" = "#587539"
"ui.filler" = "#CFD4E2"

"git.modified" = "#2E7DE9"
"git.added" = "#587539"
"git.unversioned" = "#F52A65"
"git.deleted" = "#8990B3"
"git.ignored" = "#8A807E"
"git.conflict" = "#F52A65"
"git.renamed" = "#007197"

"syntax.text" = "#3760BF"
"syntax.keyword" = "#9854F1"
"syntax.string" = "#587539"
"syntax.function" = "#2E7DE9"
"syntax.type" = "#188092"
"syntax.comment" = "#777EA3"
"syntax.attribute" = "#8C6C3E"
"syntax.number" = "#B15C00"
"syntax.constant" = "#B15C00"
"syntax.operator" = "#007197"
"syntax.punctuation" = "#6682C5"
"syntax.tag" = "#F52A65"
"syntax.heading" = "#2E7DE9"
"syntax.link" = "#007197"
"syntax.code" = "#587539"

"diff.inserted" = "#E1E2E7"
"diff.modified" = "#E1E2E7"
"diff.deleted" = "#E1E2E7"
"diff.word.inserted" = "#B3BEAC"
"diff.word.modified" = "#A2BEE8"
"diff.word.deleted" = "#E7A9BF"
"gutter.added" = "#81966D"
"gutter.modified" = "#649BE8"
"gutter.deleted" = "#EF618C"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
