# Tokyo Night Day: herdr's "tokyo-night-day" theme, from its published palette.
name = "Tokyo Night Day"

[palette]
"ui.bg" = "#E1E2E7"
"ui.panel" = "#D0D5E3"
"ui.panel.alt" = "#D0D5E3"
"ui.text" = "#3358B0"
"ui.text.strong" = "#2A4A99"
"ui.dim" = "#68709A"
"ui.header" = "#68709A"
"ui.border" = "#C4C8DA"
"ui.border.focused" = "#2E7DE9"
"ui.selection" = "#D0D5E5"
"ui.selection.inactive" = "#CAD0E5"
"ui.accent" = "#2E7DE9"
"ui.cursorline" = "#D8DCE5"
"ui.linenr" = "#68709A"
"ui.popup" = "#D0D5E3"
"ui.popup.border" = "#A8AECB"
"ui.input" = "#D0D5E3"
"ui.match" = "#C7BEB3"
"ui.match.text" = "#2A4A99"
"ui.button" = "#2E7DE9"
"ui.button.text" = "#000000"
"ui.error" = "#F52A65"
"ui.warning" = "#8C6C3E"
"ui.success" = "#587539"
"ui.filler" = "#CDD2E2"

"git.modified" = "#2B76DB"
"git.added" = "#587539"
"git.unversioned" = "#E1275D"
"git.deleted" = "#68709A"
"git.ignored" = "#786E71"
"git.conflict" = "#E1275D"
"git.renamed" = "#007197"

"syntax.text" = "#3358B0"
"syntax.keyword" = "#9854F1"
"syntax.string" = "#587539"
"syntax.function" = "#2E7DE9"
"syntax.type" = "#188092"
"syntax.comment" = "#777EA3"
"syntax.attribute" = "#8C6C3E"
"syntax.number" = "#B15C00"
"syntax.constant" = "#B15C00"
"syntax.operator" = "#007197"
"syntax.punctuation" = "#597AC7"
"syntax.tag" = "#F52A65"
"syntax.heading" = "#2E7DE9"
"syntax.link" = "#007197"
"syntax.code" = "#587539"

"diff.inserted" = "#D1D6D3"
"diff.modified" = "#CBD6E7"
"diff.deleted" = "#E3D1DA"
"diff.word.inserted" = "#B1BCAA"
"diff.word.modified" = "#A2BEE8"
"diff.word.deleted" = "#E8A1B9"
"gutter.added" = "#81966D"
"gutter.modified" = "#649BE8"
"gutter.deleted" = "#EF618C"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
