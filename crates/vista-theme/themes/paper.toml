# Design C — Paper Light: IntelliJ New UI style, light, rounded panels, icon rail.
name = "Paper Light"

[palette]
"ui.bg" = "#FFFFFF"
"ui.panel" = "#EEF0F3"
"ui.panel.alt" = "#F7F8FA"
"ui.header" = "#1F2328"
"ui.border" = "#C9CDD3"
"ui.border.focused" = "#3574F0"
"ui.text" = "#1F2328"
"ui.text.strong" = "#000000"
"ui.dim" = "#59636E"
"ui.selection" = "#D6E4FD"
"ui.selection.inactive" = "#E6E9EE"
"ui.accent" = "#2458C9"
"ui.cursorline" = "#F2F6FD"
"ui.linenr" = "#6E7781"
"ui.popup" = "#FFFFFF"
"ui.popup.border" = "#C9CDD3"
"ui.input" = "#F7F8FA"
"ui.match" = "#FBE7A6"
"ui.match.text" = "#1F2328"
"ui.button" = "#2458C9"
"ui.button.text" = "#FFFFFF"
"ui.error" = "#C62828"
"ui.warning" = "#8A5A00"
"ui.success" = "#2B7A2F"
"ui.filler" = "#C9CDD3"

"git.modified" = "#2458C9"
"git.added" = "#2B7A2F"
"git.unversioned" = "#B3401E"
"git.deleted" = "#6E7781"
"git.ignored" = "#6F6A00"
"git.conflict" = "#C62828"
"git.renamed" = "#2458C9"

"syntax.text" = "#1F2328"
"syntax.keyword" = "#0033B3"
"syntax.string" = "#067D17"
"syntax.function" = "#00627A"
"syntax.type" = "#6F3B96"
"syntax.comment" = "#6E7781"
"syntax.attribute" = "#7A6500"
"syntax.number" = "#1750EB"
"syntax.constant" = "#871094"
"syntax.operator" = "#1F2328"
"syntax.punctuation" = "#1F2328"
"syntax.tag" = "#0033B3"
"syntax.heading" = "#0033B3"
"syntax.link" = "#2458C9"
"syntax.code" = "#067D17"

"diff.inserted" = "#E3F4E1"
"diff.modified" = "#E4EDFC"
"diff.deleted" = "#F1F1F1"
"diff.word.inserted" = "#BEE5B9"
"diff.word.modified" = "#B9D0F7"
"diff.word.deleted" = "#DADADA"
"gutter.added" = "#8FCB89"
"gutter.modified" = "#8DB2F2"
"gutter.deleted" = "#B8BEC6"

[chrome]
borders = "rounded"
panel_headers = "border-title"
tabs = "pill"
tool_windows = "icon-rail"
git_indicator = "colour"
keyhints = false
spacing = "comfortable"
