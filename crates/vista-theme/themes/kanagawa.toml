# Kanagawa: herdr's "kanagawa" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Kanagawa"
terminal_bg = "#1F1F28"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#1F1F28"
"ui.panel.alt" = "terminal"
"ui.text" = "#C7C3AA"
"ui.text.strong" = "#DCD7BA"
"ui.dim" = "#727169"
"ui.header" = "#87867D"
"ui.border" = "#1F1F28"
"ui.border.focused" = "#7E9CD8"
"ui.selection" = "#2D4F67"
"ui.selection.inactive" = "#363646"
"ui.accent" = "#7E9CD8"
"ui.cursorline" = "#27272E"
"ui.linenr" = "#727169"
"ui.popup" = "#1F1F28"
"ui.popup.border" = "#87867D"
"ui.input" = "#1F1F28"
"ui.match" = "#5F5345"
"ui.match.text" = "#DCD7BA"
"ui.button" = "#7E9CD8"
"ui.button.text" = "#1F1F28"
"ui.error" = "#C34043"
"ui.warning" = "#C0A36E"
"ui.success" = "#76946A"
"ui.filler" = "#333338"

"git.modified" = "#7E9CD8"
"git.added" = "#76946A"
"git.unversioned" = "#C34043"
"git.deleted" = "#727169"
"git.ignored" = "#A69675"
"git.conflict" = "#E82424"
"git.renamed" = "#7FB4CA"

"syntax.text" = "#DCD7BA"
"syntax.keyword" = "#957FB8"
"syntax.string" = "#98BB6C"
"syntax.function" = "#7E9CD8"
"syntax.type" = "#7AA89F"
"syntax.comment" = "#727169"
"syntax.attribute" = "#E6C384"
"syntax.number" = "#FFA066"
"syntax.constant" = "#FFA066"
"syntax.operator" = "#7FB4CA"
"syntax.punctuation" = "#A5A290"
"syntax.tag" = "#E46876"
"syntax.heading" = "#7E9CD8"
"syntax.link" = "#7FB4CA"
"syntax.code" = "#98BB6C"

"diff.inserted" = "#373E36"
"diff.modified" = "#32384B"
"diff.deleted" = "#462E38"
"diff.word.inserted" = "#546446"
"diff.word.modified" = "#495675"
"diff.word.deleted" = "#763F4A"
"gutter.added" = "#748C58"
"gutter.modified" = "#6176A3"
"gutter.deleted" = "#A9525F"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
