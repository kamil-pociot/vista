"syntax.number" = "#FFA066"
"syntax.constant" = "#FFA066"
"syntax.operator" = "#7FB4CA"
"syntax.punctuation" = "#B6B29D"
"syntax.tag" = "#E46876"
"syntax.heading" = "#7E9CD8"
"syntax.link" = "#7FB4CA"
"syntax.code" = "#98BB6C"

"diff.inserted" = "#373E36"
"diff.modified" = "#32384B"
