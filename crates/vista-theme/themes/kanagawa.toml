# Kanagawa Wave: herdr's "kanagawa" theme, from its published palette.
name = "Kanagawa Wave"

[palette]
"ui.bg" = "#1F1F28"
"ui.panel" = "#16161D"
"ui.panel.alt" = "#1A1A22"
"ui.text" = "#DCD7BA"
"ui.text.strong" = "#F2EDD0"
"ui.dim" = "#938AA9"
"ui.header" = "#938AA9"
"ui.border" = "#2A2A37"
"ui.border.focused" = "#7E9CD8"
"ui.selection" = "#2D4F67"
"ui.selection.inactive" = "#223249"
"ui.accent" = "#7E9CD8"
"ui.cursorline" = "#28282F"
"ui.linenr" = "#938AA9"
"ui.popup" = "#16161D"
"ui.popup.border" = "#54546D"
"ui.input" = "#16161D"
"ui.match" = "#5F5345"
"ui.match.text" = "#F2EDD0"
"ui.button" = "#7E9CD8"
