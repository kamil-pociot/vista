# Gruvbox: herdr's "gruvbox" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Gruvbox"
terminal_bg = "#282828"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#282828"
"ui.panel.alt" = "terminal"
"ui.text" = "#D9C9A6"
"ui.text.strong" = "#EBDBB2"
"ui.dim" = "#928374"
"ui.header" = "#A89984"
"ui.border" = "#282828"
"ui.border.focused" = "#D79921"
"ui.selection" = "#504945"
"ui.selection.inactive" = "#323130"
"ui.accent" = "#D79921"
"ui.cursorline" = "#31302E"
"ui.linenr" = "#928374"
"ui.popup" = "#282828"
"ui.popup.border" = "#A89984"
"ui.input" = "#282828"
"ui.match" = "#6B582A"
"ui.match.text" = "#EBDBB2"
"ui.button" = "#D79921"
"ui.button.text" = "#282828"
"ui.error" = "#FB4934"
"ui.warning" = "#FABD2F"
"ui.success" = "#B8BB26"
"ui.filler" = "#3D3B37"

"git.modified" = "#83A598"
"git.added" = "#B8BB26"
"git.unversioned" = "#FB4934"
"git.deleted" = "#928374"
"git.ignored" = "#C19D55"
"git.conflict" = "#FB4934"
"git.renamed" = "#8EC07C"

"syntax.text" = "#EBDBB2"
"syntax.keyword" = "#D3869B"
"syntax.string" = "#B8BB26"
"syntax.function" = "#83A598"
"syntax.type" = "#FABD2F"
"syntax.comment" = "#928374"
"syntax.attribute" = "#FABD2F"
"syntax.number" = "#FE8019"
"syntax.constant" = "#FE8019"
"syntax.operator" = "#8EC07C"
"syntax.punctuation" = "#B6A98D"
"syntax.tag" = "#FB4934"
"syntax.heading" = "#D79921"
"syntax.link" = "#8EC07C"
"syntax.code" = "#B8BB26"

"diff.inserted" = "#454528"
"diff.modified" = "#3A413E"
"diff.deleted" = "#522F2A"
"diff.word.inserted" = "#676927"
"diff.word.modified" = "#505F59"
"diff.word.deleted" = "#85372D"
"gutter.added" = "#8D8F27"
"gutter.modified" = "#687F76"
"gutter.deleted" = "#BC3F30"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
