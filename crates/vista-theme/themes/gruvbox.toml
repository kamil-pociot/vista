# Gruvbox Dark: herdr's "gruvbox" theme, from its published palette.
name = "Gruvbox Dark"

[palette]
"ui.bg" = "#282828"
"ui.panel" = "#1D2021"
"ui.panel.alt" = "#1D2021"
"ui.text" = "#EBDBB2"
"ui.text.strong" = "#FBF1C7"
"ui.dim" = "#A89984"
"ui.header" = "#A89984"
"ui.border" = "#3C3836"
"ui.border.focused" = "#FABD2F"
"ui.selection" = "#504945"
"ui.selection.inactive" = "#3E3A38"
"ui.accent" = "#FABD2F"
"ui.cursorline" = "#32312F"
"ui.linenr" = "#A89984"
"ui.popup" = "#1D2021"
"ui.popup.border" = "#665C54"
"ui.input" = "#1D2021"
"ui.match" = "#6B582A"
"ui.match.text" = "#FBF1C7"
"ui.button" = "#FABD2F"
"ui.button.text" = "#282828"
"ui.error" = "#FB4934"
"ui.warning" = "#FABD2F"
"ui.success" = "#B8BB26"
"ui.filler" = "#3F3D39"

"git.modified" = "#83A598"
"git.added" = "#B8BB26"
"git.unversioned" = "#FB4934"
"git.deleted" = "#A89984"
"git.ignored" = "#CDA95E"
"git.conflict" = "#FB4934"
"git.renamed" = "#8EC07C"

"syntax.text" = "#EBDBB2"
"syntax.keyword" = "#D3869B"
"syntax.string" = "#B8BB26"
"syntax.function" = "#83A598"
"syntax.type" = "#FABD2F"
"syntax.comment" = "#928374"
"syntax.attribute" = "#FABD2F"
"syntax.number" = "#FE8019"
"syntax.constant" = "#FE8019"
"syntax.operator" = "#8EC07C"
"syntax.punctuation" = "#C4B796"
"syntax.tag" = "#FB4934"
"syntax.heading" = "#FABD2F"
"syntax.link" = "#8EC07C"
"syntax.code" = "#B8BB26"

"diff.inserted" = "#454528"
"diff.modified" = "#3A413E"
"diff.deleted" = "#522F2A"
"diff.word.inserted" = "#676927"
"diff.word.modified" = "#505F59"
"diff.word.deleted" = "#85372D"
"gutter.added" = "#8D8F27"
"gutter.modified" = "#687F76"
"gutter.deleted" = "#BC3F30"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
