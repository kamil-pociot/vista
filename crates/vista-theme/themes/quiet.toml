# Design B — Quiet Modal: borderless, minimal, key hints, status letters.
name = "Quiet Modal"

[palette]
"ui.bg" = "#16181D"
"ui.panel" = "#1C1F27"
"ui.panel.alt" = "#16181D"
"ui.header" = "#8A93A3"
"ui.border" = "#262A33"
"ui.border.focused" = "#7AA2F7"
"ui.text" = "#C9CED6"
"ui.text.strong" = "#E6E9EF"
"ui.dim" = "#8A93A3"
"ui.selection" = "#2A3142"
"ui.selection.inactive" = "#20242E"
"ui.accent" = "#7AA2F7"
"ui.cursorline" = "#1C1F27"
"ui.linenr" = "#8A93A3"
"ui.popup" = "#16181D"
"ui.popup.border" = "#3A3F4B"
"ui.input" = "#1C1F27"
"ui.match" = "#4A3A1C"
"ui.match.text" = "#F5C97A"
"ui.button" = "#7AA2F7"
"ui.button.text" = "#16181D"
"ui.error" = "#F7768E"
"ui.warning" = "#E0AF68"
"ui.success" = "#9ECE6A"
"ui.filler" = "#2E3340"

"git.modified" = "#7AA2F7"
"git.added" = "#9ECE6A"
"git.unversioned" = "#E0AF68"
"git.deleted" = "#8A93A3"
"git.ignored" = "#7F8796"
"git.conflict" = "#F7768E"
"git.renamed" = "#7AA2F7"

"syntax.text" = "#C9CED6"
"syntax.keyword" = "#BB9AF7"
"syntax.string" = "#9ECE6A"
"syntax.function" = "#7AA2F7"
"syntax.type" = "#2AC3DE"
"syntax.comment" = "#7F86AE"
"syntax.attribute" = "#E0AF68"
"syntax.number" = "#FF9E64"
"syntax.constant" = "#FF9E64"
"syntax.operator" = "#89DDFF"
"syntax.punctuation" = "#A9B1D6"
"syntax.tag" = "#F7768E"
"syntax.heading" = "#7AA2F7"
"syntax.link" = "#7DCFFF"
"syntax.code" = "#9ECE6A"

"diff.inserted" = "#1C2B22"
"diff.modified" = "#1E2538"
"diff.deleted" = "#2E1E23"
"diff.word.inserted" = "#2C4A33"
"diff.word.modified" = "#33456E"
"diff.word.deleted" = "#4D2830"
"gutter.added" = "#4F7A3A"
"gutter.modified" = "#3D59A1"
"gutter.deleted" = "#8A4A55"

[chrome]
borders = "none"
panel_headers = "inline"
tabs = "text"
tool_windows = "none"
git_indicator = "colour+letter"
keyhints = true
spacing = "compact"
