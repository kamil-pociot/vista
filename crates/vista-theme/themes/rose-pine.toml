# Rosé Pine: herdr's "rose-pine" theme, from its published palette.
name = "Rosé Pine"

[palette]
"ui.bg" = "#191724"
"ui.panel" = "#1F1D2E"
"ui.panel.alt" = "#1F1D2E"
"ui.text" = "#E0DEF4"
"ui.text.strong" = "#E0DEF4"
"ui.dim" = "#908CAA"
"ui.header" = "#908CAA"
"ui.border" = "#26233A"
"ui.border.focused" = "#C4A7E7"
"ui.selection" = "#403D52"
"ui.selection.inactive" = "#26233A"
"ui.accent" = "#C4A7E7"
"ui.cursorline" = "#23212E"
"ui.linenr" = "#908CAA"
"ui.popup" = "#1F1D2E"
"ui.popup.border" = "#524F67"
"ui.input" = "#1F1D2E"
"ui.match" = "#604D3F"
"ui.match.text" = "#E0DEF4"
"ui.button" = "#C4A7E7"
"ui.button.text" = "#191724"
"ui.error" = "#EB6F92"
"ui.warning" = "#F6C177"
"ui.success" = "#31748F"
"ui.filler" = "#312F3D"

"git.modified" = "#9CCFD8"
"git.added" = "#31748F"
"git.unversioned" = "#EB6F92"
"git.deleted" = "#908CAA"
"git.ignored" = "#BEA493"
"git.conflict" = "#EB6F92"
