# Rosé Pine: herdr's "rose-pine" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "Rosé Pine"
terminal_bg = "#191724"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#191724"
"ui.panel.alt" = "terminal"
"ui.text" = "#C9C7DE"
"ui.text.strong" = "#E0DEF4"
"ui.dim" = "#6E6A86"
"ui.header" = "#908CAA"
"ui.border" = "#26233A"
"ui.border.focused" = "#C4A7E7"
"ui.selection" = "#403D52"
"ui.selection.inactive" = "#26233A"
"ui.accent" = "#C4A7E7"
"ui.cursorline" = "#22202D"
"ui.linenr" = "#6E6A86"
"ui.popup" = "#191724"
"ui.popup.border" = "#908CAA"
"ui.input" = "#191724"
"ui.match" = "#604D3F"
"ui.match.text" = "#E0DEF4"
"ui.button" = "#C4A7E7"
"ui.button.text" = "#191724"
"ui.error" = "#EB6F92"
"ui.warning" = "#F6C177"
"ui.success" = "#31748F"
"ui.filler" = "#2E2C3A"

"git.modified" = "#9CCFD8"
"git.added" = "#31748F"
"git.unversioned" = "#EB6F92"
"git.deleted" = "#6E6A86"
"git.ignored" = "#AB917F"
"git.conflict" = "#EB6F92"
"git.renamed" = "#9CCFD8"

"syntax.text" = "#E0DEF4"
"syntax.keyword" = "#C4A7E7"
"syntax.string" = "#31748F"
"syntax.function" = "#9CCFD8"
"syntax.type" = "#9CCFD8"
"syntax.comment" = "#6E6A86"
"syntax.attribute" = "#F6C177"
"syntax.number" = "#EBBCBA"
"syntax.constant" = "#EBBCBA"
"syntax.operator" = "#9CCFD8"
"syntax.punctuation" = "#A6A4B9"
"syntax.tag" = "#EB6F92"
"syntax.heading" = "#C4A7E7"
"syntax.link" = "#9CCFD8"
"syntax.code" = "#31748F"

"diff.inserted" = "#1E2A39"
"diff.modified" = "#333C48"
"diff.deleted" = "#43293A"
"diff.word.inserted" = "#244053"
"diff.word.modified" = "#536873"
"diff.word.deleted" = "#753E54"
"gutter.added" = "#2A586F"
"gutter.modified" = "#7598A2"
"gutter.deleted" = "#AC5571"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
