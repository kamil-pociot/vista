# Dracula: herdr's "dracula" theme, from its published palette.
name = "Dracula"

[palette]
"ui.bg" = "#282A36"
"ui.panel" = "#21222C"
"ui.panel.alt" = "#21222C"
"ui.text" = "#F8F8F2"
"ui.text.strong" = "#F8F8F2"
"ui.dim" = "#9AA3C8"
"ui.header" = "#9AA3C8"
"ui.border" = "#44475A"
"ui.border.focused" = "#BD93F9"
"ui.selection" = "#44475A"
"ui.selection.inactive" = "#373A4A"
"ui.accent" = "#BD93F9"
"ui.cursorline" = "#32343F"
"ui.linenr" = "#9AA3C8"
"ui.popup" = "#21222C"
"ui.popup.border" = "#6272A4"
"ui.input" = "#21222C"
"ui.match" = "#686D52"
"ui.match.text" = "#F8F8F2"
"ui.button" = "#BD93F9"
"ui.button.text" = "#282A36"
"ui.error" = "#FF5555"
"ui.warning" = "#F1FA8C"
"ui.success" = "#50FA7B"
"ui.filler" = "#41434D"

"git.modified" = "#BD93F9"
"git.added" = "#50FA7B"
"git.unversioned" = "#FF5555"
"git.deleted" = "#9AA3C8"
"git.ignored" = "#C1CAAD"
"git.conflict" = "#FF5555"
"git.renamed" = "#8BE9FD"

"syntax.text" = "#F8F8F2"
"syntax.keyword" = "#FF79C6"
"syntax.string" = "#50FA7B"
"syntax.function" = "#BD93F9"
"syntax.type" = "#8BE9FD"
"syntax.comment" = "#6272A4"
"syntax.attribute" = "#F1FA8C"
"syntax.number" = "#FFB86C"
"syntax.constant" = "#FFB86C"
"syntax.operator" = "#8BE9FD"
"syntax.punctuation" = "#CECFCC"
"syntax.tag" = "#FF5555"
"syntax.heading" = "#BD93F9"
"syntax.link" = "#8BE9FD"
"syntax.code" = "#50FA7B"

"diff.inserted" = "#305444"
"diff.modified" = "#463F5D"
"diff.deleted" = "#53333C"
"diff.word.inserted" = "#3A8654"
"diff.word.modified" = "#6A588C"
"diff.word.deleted" = "#873D44"
"gutter.added" = "#44BC66"
"gutter.modified" = "#9074BE"
"gutter.deleted" = "#BE484C"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
