# One Light: herdr's "one-light" theme, from its published palette.
name = "One Light"

[palette]
"ui.bg" = "#FAFAFA"
"ui.panel" = "#F0F0F1"
"ui.panel.alt" = "#F0F0F1"
"ui.text" = "#383A42"
"ui.text.strong" = "#202227"
"ui.dim" = "#696C77"
"ui.header" = "#696C77"
"ui.border" = "#E5E5E6"
"ui.border.focused" = "#4078F2"
"ui.selection" = "#E5E5E6"
"ui.selection.inactive" = "#EEEEEF"
"ui.accent" = "#4078F2"
"ui.cursorline" = "#F0F0F1"
"ui.linenr" = "#696C77"
"ui.popup" = "#F0F0F1"
"ui.popup.border" = "#9D9D9F"
"ui.input" = "#F0F0F1"
"ui.match" = "#E8D4AA"
"ui.match.text" = "#202227"
"ui.button" = "#4078F2"
"ui.button.text" = "#000000"
"ui.error" = "#E45649"
"ui.warning" = "#C18401"
"ui.success" = "#50A14F"
"ui.filler" = "#E3E3E4"

"git.modified" = "#4078F2"
"git.added" = "#4D9B4C"
"git.unversioned" = "#E45649"
"git.deleted" = "#696C77"
"git.ignored" = "#917742"
"git.conflict" = "#E45649"
"git.renamed" = "#0184BC"

"syntax.text" = "#383A42"
"syntax.keyword" = "#A626A4"
"syntax.string" = "#50A14F"
"syntax.function" = "#4078F2"
"syntax.type" = "#C18401"
"syntax.comment" = "#909196"
"syntax.attribute" = "#C18401"
"syntax.number" = "#986801"
"syntax.constant" = "#986801"
"syntax.operator" = "#0184BC"
"syntax.punctuation" = "#5F6067"
"syntax.tag" = "#E45649"
"syntax.heading" = "#4078F2"
"syntax.link" = "#0184BC"
"syntax.code" = "#50A14F"

"diff.inserted" = "#DFECDF"
"diff.modified" = "#DCE5F9"
"diff.deleted" = "#F6E0DE"
"diff.word.inserted" = "#BEDBBE"
"diff.word.modified" = "#B9CCF7"
"diff.word.deleted" = "#F2C0BC"
"gutter.added" = "#83BC82"
"gutter.modified" = "#789FF4"
"gutter.deleted" = "#EB877E"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
