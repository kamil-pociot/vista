# One Light: herdr's "one-light" theme. Chrome colours as herdr draws them (the
# editor and tree on the terminal's background, like herdr's panes),
# syntax and git from the published palette.
name = "One Light"
terminal_bg = "#FAFAFA"

[palette]
"ui.bg" = "terminal"
"ui.panel" = "#FAFAFA"
"ui.panel.alt" = "terminal"
"ui.text" = "#4D4F56"
"ui.text.strong" = "#383A42"
"ui.dim" = "#909196"
"ui.header" = "#686B77"
"ui.border" = "#F5F5F6"
"ui.border.focused" = "#4078F2"
"ui.selection" = "#E5E5E6"
"ui.selection.inactive" = "#D8DBE2"
"ui.accent" = "#4078F2"
"ui.cursorline" = "#F1F1F2"
"ui.linenr" = "#909196"
"ui.popup" = "#FAFAFA"
"ui.popup.border" = "#686B77"
"ui.input" = "#FAFAFA"
"ui.match" = "#E8D4AA"
"ui.match.text" = "#383A42"
"ui.button" = "#4078F2"
"ui.button.text" = "#000000"
"ui.error" = "#E45649"
"ui.warning" = "#C18401"
"ui.success" = "#50A14F"
"ui.filler" = "#E5E5E6"

"git.modified" = "#4078F2"
"git.added" = "#50A14F"
"git.unversioned" = "#E45649"
"git.deleted" = "#A0A1A7"
"git.ignored" = "#AF945C"
"git.conflict" = "#E45649"
"git.renamed" = "#0184BC"

"syntax.text" = "#383A42"
"syntax.keyword" = "#A626A4"
"syntax.string" = "#50A14F"
"syntax.function" = "#4078F2"
"syntax.type" = "#C18401"
"syntax.comment" = "#909196"
"syntax.attribute" = "#C18401"
"syntax.number" = "#986801"
"syntax.constant" = "#986801"
"syntax.operator" = "#0184BC"
"syntax.punctuation" = "#707177"
"syntax.tag" = "#E45649"
"syntax.heading" = "#4078F2"
"syntax.link" = "#0184BC"
"syntax.code" = "#50A14F"

"diff.inserted" = "#DFECDF"
"diff.modified" = "#DCE5F9"
"diff.deleted" = "#F6E0DE"
"diff.word.inserted" = "#BEDBBE"
"diff.word.modified" = "#B9CCF7"
"diff.word.deleted" = "#F2C0BC"
"gutter.added" = "#83BC82"
"gutter.modified" = "#789FF4"
"gutter.deleted" = "#EB877E"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
