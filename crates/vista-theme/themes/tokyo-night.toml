# Tokyo Night: herdr's "tokyo-night" theme, from its published palette.
name = "Tokyo Night"

[palette]
"ui.bg" = "#1A1B26"
"ui.panel" = "#16161E"
"ui.panel.alt" = "#16161E"
"ui.text" = "#C0CAF5"
"ui.text.strong" = "#DCE3FF"
"ui.dim" = "#737AA2"
"ui.header" = "#737AA2"
"ui.border" = "#292E42"
"ui.border.focused" = "#7AA2F7"
"ui.selection" = "#33467C"
"ui.selection.inactive" = "#283355"
"ui.accent" = "#7AA2F7"
"ui.cursorline" = "#222430"
"ui.linenr" = "#737AA2"
"ui.popup" = "#16161E"
"ui.popup.border" = "#3B4261"
"ui.input" = "#16161E"
"ui.match" = "#594A3B"
"ui.match.text" = "#DCE3FF"
"ui.button" = "#7AA2F7"
"ui.button.text" = "#1A1B26"
"ui.error" = "#F7768E"
"ui.warning" = "#E0AF68"
"ui.success" = "#9ECE6A"
"ui.filler" = "#2E303F"

"git.modified" = "#7AA2F7"
"git.added" = "#9ECE6A"
"git.unversioned" = "#F7768E"
"git.deleted" = "#737AA2"
"git.ignored" = "#A49288"
"git.conflict" = "#F7768E"
"git.renamed" = "#7DCFFF"

"syntax.text" = "#C0CAF5"
"syntax.keyword" = "#BB9AF7"
"syntax.string" = "#9ECE6A"
"syntax.function" = "#7AA2F7"
"syntax.type" = "#2AC3DE"
"syntax.comment" = "#5D658E"
"syntax.attribute" = "#E0AF68"
"syntax.number" = "#FF9E64"
"syntax.constant" = "#FF9E64"
"syntax.operator" = "#7DCFFF"
"syntax.punctuation" = "#9FA7CC"
"syntax.tag" = "#F7768E"
"syntax.heading" = "#7AA2F7"
"syntax.link" = "#7DCFFF"
"syntax.code" = "#9ECE6A"

"diff.inserted" = "#343F34"
"diff.modified" = "#2D3650"
"diff.deleted" = "#462D3B"
"diff.word.inserted" = "#546A44"
"diff.word.modified" = "#445682"
"diff.word.deleted" = "#7B4354"
"gutter.added" = "#769856"
"gutter.modified" = "#5D7AB8"
"gutter.deleted" = "#B55B6F"

[chrome]
borders = "plain"
panel_headers = "titled-bar"
tabs = "underline"
tool_windows = "bottom-bar"
git_indicator = "colour"
keyhints = false
spacing = "compact"
