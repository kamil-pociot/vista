[package]
name = "vista-render"
description = "Syntax highlighting, Markdown rendering and file-type detection for vista (UI-agnostic, theme tokens only)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
# Mermaid diagrams, headless (no browser or Node): Unicode text and SVG,
# drawn with resvg (any region at any zoom). Without ELK (EPL-2.0);
# Cytoscape layout as Mermaid's own default.
merman = { version = "0.9.2", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape", "ascii"] }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde_json = "1"

[dev-dependencies]
proptest.workspace = true
